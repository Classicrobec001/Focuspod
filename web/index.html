<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover + the safe-area insets in index.css let the device
      shell run edge to edge on notched phones.
      user-scalable=no: the click wheel is a drag surface — pinch-zoom and
      double-tap-to-zoom would fight every gesture.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2A2A2A" />
    <meta name="description" content="Distraction-free public-domain audiobooks with an iPod click wheel and focus sessions." />

    <!-- iOS standalone behaviour: no Safari chrome once added to the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FocusPod" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <title>FocusPod</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
