name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    # The RN app has no bearing on the web build.
    paths:
      - 'web/**'
      - 'core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A superseded deploy is wasted work, but never cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck core
        run: npm run typecheck --workspace @focuspod/core

      - name: Build
        # GitHub Pages serves project sites under /<repo>/, so the bundle,
        # manifest start_url and service worker scope all need that prefix.
        run: npm run build --workspace @focuspod/web
        env:
          VITE_BASE: /Focuspod/
          # Optional. Set a repository *variable* named GA_MEASUREMENT_ID
          # (Settings → Secrets and variables → Actions → Variables) to switch
          # analytics on. Left unset, no tracking code is bundled at all and the
          # consent prompt and Settings row never appear.
          VITE_GA_ID: ${{ vars.GA_MEASUREMENT_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
